server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 1024;

    # Same-origin `/api` → Spring Boot (browser uses relative URLs; no :9000 in the page).
    location /api {
        proxy_pass http://backend:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Scripts and styles have content hashes in their names (main.3f2a….js),
    # so they can be cached for a year — a new deploy gets new names.
    # index.html and the push worker must always be re-checked.
    location ~* "\.[0-9a-f]{16,}\.(?:js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Icons, bank logos, fonts: same names across deploys — cache for a week.
    location ~* \.(?:png|jpg|jpeg|svg|ico|webp|woff2?|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /push-sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
