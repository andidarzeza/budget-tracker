# Behind the server's nginx (HTTPS): keep its X-Forwarded-Proto instead of replacing it with
# this hop's "http". Otherwise the API thinks the page is http://, sees the browser's
# https:// Origin as another site and refuses the call ("Invalid CORS request").
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 1024;

    # Same-origin `/api` → Spring Boot (browser uses relative URLs; no :9000 in the page).
    location /api {
        proxy_pass http://backend:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Scripts and styles have content hashes in their names (main.3f2a….js),
    # so they can be cached for a year — a new deploy gets new names.
    # index.html and the push worker must always be re-checked.
    location ~* "\.[0-9a-f]{16,}\.(?:js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Icons, bank logos, fonts: same names across deploys — cache for a week.
    location ~* \.(?:png|jpg|jpeg|svg|ico|webp|woff2?|ttf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /push-sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
