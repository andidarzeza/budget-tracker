<!doctype html>
<html lang="en">

<head>

  <style>
    /* Start-up loader: the iOS activity indicator (same artwork as the
       in-app spinner), on the system grouped background. Faded out by
       AppComponent once the first route is active. */
    #application-loader {
      transition: opacity 200ms ease-out;
      pointer-events: none;
      opacity: 1;
      width: 100%;
      height: 100%;
      background: #f2f2f7;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    #application-loader .ios-spinner {
      width: 36px;
      height: 36px;
      background: #8e8e93;
      -webkit-mask: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2040%2040'%20stroke='black'%20stroke-width='3.8'%20stroke-linecap='round'%3E%3Cline%20x1='20.00'%20y1='11.00'%20x2='20.00'%20y2='3.00'%20stroke-opacity='1'/%3E%3Cline%20x1='26.36'%20y1='13.64'%20x2='32.02'%20y2='7.98'%20stroke-opacity='0.2'/%3E%3Cline%20x1='29.00'%20y1='20.00'%20x2='37.00'%20y2='20.00'%20stroke-opacity='0.28'/%3E%3Cline%20x1='26.36'%20y1='26.36'%20x2='32.02'%20y2='32.02'%20stroke-opacity='0.36'/%3E%3Cline%20x1='20.00'%20y1='29.00'%20x2='20.00'%20y2='37.00'%20stroke-opacity='0.45'/%3E%3Cline%20x1='13.64'%20y1='26.36'%20x2='7.98'%20y2='32.02'%20stroke-opacity='0.55'/%3E%3Cline%20x1='11.00'%20y1='20.00'%20x2='3.00'%20y2='20.00'%20stroke-opacity='0.68'/%3E%3Cline%20x1='13.64'%20y1='13.64'%20x2='7.98'%20y2='7.98'%20stroke-opacity='0.82'/%3E%3C/svg%3E") center / contain no-repeat;
      mask: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2040%2040'%20stroke='black'%20stroke-width='3.8'%20stroke-linecap='round'%3E%3Cline%20x1='20.00'%20y1='11.00'%20x2='20.00'%20y2='3.00'%20stroke-opacity='1'/%3E%3Cline%20x1='26.36'%20y1='13.64'%20x2='32.02'%20y2='7.98'%20stroke-opacity='0.2'/%3E%3Cline%20x1='29.00'%20y1='20.00'%20x2='37.00'%20y2='20.00'%20stroke-opacity='0.28'/%3E%3Cline%20x1='26.36'%20y1='26.36'%20x2='32.02'%20y2='32.02'%20stroke-opacity='0.36'/%3E%3Cline%20x1='20.00'%20y1='29.00'%20x2='20.00'%20y2='37.00'%20stroke-opacity='0.45'/%3E%3Cline%20x1='13.64'%20y1='26.36'%20x2='7.98'%20y2='32.02'%20stroke-opacity='0.55'/%3E%3Cline%20x1='11.00'%20y1='20.00'%20x2='3.00'%20y2='20.00'%20stroke-opacity='0.68'/%3E%3Cline%20x1='13.64'%20y1='13.64'%20x2='7.98'%20y2='7.98'%20stroke-opacity='0.82'/%3E%3C/svg%3E") center / contain no-repeat;
      animation: app-loader-spin 0.8s steps(8) infinite;
    }

    @keyframes app-loader-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-color-scheme: dark) {
      #application-loader { background: #000000; }
    }

    body.dark-theme #application-loader {
      background: #000000;
    }
  </style>

  <meta charset="utf-8">
  <title>Financa</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#ff3b30">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Financa">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&display=block" rel="stylesheet">
</head>

  <div id="application-loader" role="status" aria-label="Loading">
    <div class="ios-spinner"></div>
  </div>
