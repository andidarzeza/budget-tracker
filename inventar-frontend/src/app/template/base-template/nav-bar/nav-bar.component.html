@if (authenticationService.currentUserValue && isMobileLayout()) {
<!-- iOS-style navigation bar: transparent over the page's large title, then
     frosted glass with a small centred title once the content scrolls. -->
<header class="toolbar" [class.toolbar--scrolled]="scrolled()">
    <span class="toolbar__side" aria-hidden="true"></span>

    <h1 class="toolbar__title" [attr.aria-hidden]="!scrolled()">{{ pageTitle() }}</h1>

    <div class="toolbar__side toolbar__side--end">
        <button type="button" class="nav-avatar-btn"
            [matMenuTriggerFor]="userMenu"
            aria-label="Account menu">
            <span class="nav-avatar" aria-hidden="true">
                {{ firstName?.charAt(0) | uppercase }}{{ lastName?.charAt(0) | uppercase }}
            </span>
        </button>
    </div>

    <mat-menu xPosition="before" class="user-menu" #userMenu="matMenu">
        <div class="user-menu__head" (click)="$event.stopPropagation()">
            <span class="nav-avatar nav-avatar--lg" aria-hidden="true">
                {{ firstName?.charAt(0) | uppercase }}{{ lastName?.charAt(0) | uppercase }}
            </span>
            <span class="user-menu__who">
                <span class="user-menu__name">{{ firstName | titlecase }} {{ lastName | titlecase }}</span>
                <span class="user-menu__meta">{{ now() | date:'HH:mm' }} · {{ location() }}</span>
            </span>
        </div>
        <mat-divider></mat-divider>
        <button (click)="switchAccount()" mat-menu-item>
            <mat-icon>swap_horiz</mat-icon>Switch Account
        </button>
        <button (click)="logout()" mat-menu-item>
            <mat-icon>logout</mat-icon>Logout
        </button>
    </mat-menu>
</header>
}
