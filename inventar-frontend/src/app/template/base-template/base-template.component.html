<div [@routeAnimations]="prepareRoute()" class="application-container">

    <!-- Desktop only: phones navigate with the bottom tab bar and its More popup. -->
    @if (authenticationService.currentUserValue && sideBarService.displaySidebar && !sideBarService.hiddenByUrl() && !mobileCardLayout()) {
        <side-bar [navigation]="navigation" [sideBarMode]="sideBarMode"></side-bar>
    }

    <div class="application" id="application-body"
        style="position: relative;"
        [ngStyle]="{'margin-left': applicationLeftMargin }"
        [ngClass]="authenticationService.currentUserValue ? 'app-width' : 'app-full-width'">

        @if (sideBarMode === 'over') {
            <div class="shadow" id="shadow" (click)="toggleSidebar()"></div>
        }

        @if (navBarService.displayNavBar && !sideBarService.hiddenByUrl()) {
            <nav-bar></nav-bar>
        }

        <div class="content-container" [class.content-container--public]="!authenticationService.currentUserValue"
            [class.content-container--tab-bar]="showMobileTabBar">
            <ng-content></ng-content>
        </div>
    </div>

    @if (showMobileTabBar) {
        <mobile-tab-bar></mobile-tab-bar>
    }
</div>
