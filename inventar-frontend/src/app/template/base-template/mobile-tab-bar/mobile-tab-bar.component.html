<!-- Floating glass tab bar with a separate add button, like iOS 26 apps
     (Music / Photos) that pair the tab capsule with a round action. -->
@if (moreOpen()) {
    <div class="more-backdrop" (click)="closeFromBackdrop()" aria-hidden="true"></div>

    <div class="more-menu" role="menu" aria-label="More pages">
        <div class="more-menu__list">
            @for (item of moreItems; track item.link; let i = $index) {
                <!-- A button, not a routerLink: RouterLink cancels the click's
                     default action, which would also cancel the haptic overlay's
                     hand-off to its switch (iOS haptic). -->
                <button type="button" class="more-menu__item" hapticTap role="menuitem"
                    [class.more-menu__item--slide]="menuSlideIndex() === i"
                    [class.more-menu__item--active]="isOnPage(item.link)"
                    [attr.aria-current]="isOnPage(item.link) ? 'page' : null"
                    (click)="goToMorePage(item.link)">
                    <span class="more-menu__icon" [style.background]="item.color" aria-hidden="true">
                        <mat-icon fontSet="material-symbols-rounded">{{ item.icon }}</mat-icon>
                    </span>
                    <span class="more-menu__label">{{ item.label }}</span>
                </button>
            }
        </div>
        <div class="more-menu__theme">
            <theme-switch></theme-switch>
            <pink-toggle class="more-menu__pink"></pink-toggle>
        </div>
    </div>
}

<div class="dock">
    <!-- Tap a tab, or slide a finger along the bar and release on one. -->
    <nav class="tabs" aria-label="Quick navigation" #bar
        [class.tabs--sliding]="slideIndex() !== null"
        (pointerdown)="onPointerDown($event)"
        (pointermove)="onPointerMove($event, bar)"
        (pointerup)="onPointerUp($event, bar)"
        (pointercancel)="onPointerCancel()">
        @for (tab of tabs; track tab.link; let i = $index) {
            <button type="button" class="tab" hapticTap
                [class.tab--active]="slideIndex() === null && isActive(tab)"
                [class.tab--slide]="slideIndex() === i"
                [attr.aria-current]="isActive(tab) ? 'page' : null"
                (click)="openTab(tab)">
                <mat-icon fontSet="material-symbols-rounded">{{ tab.icon }}</mat-icon>
                <span>{{ tab.label }}</span>
            </button>
        }
        <button type="button" class="tab" hapticTap
            [class.tab--active]="slideIndex() === null && (moreOpen() || onMorePage)"
            [class.tab--slide]="slideIndex() === moreIndex"
            [attr.aria-expanded]="moreOpen()" aria-haspopup="menu"
            aria-label="More pages" (click)="toggleMore()">
            <mat-icon fontSet="material-symbols-rounded">{{ moreOpen() ? 'close' : 'more_horiz' }}</mat-icon>
            <span>More</span>
        </button>
    </nav>

    <button type="button" class="add" hapticTap aria-label="Add expense" (click)="addExpense()">
        <mat-icon>add</mat-icon>
    </button>
</div>
