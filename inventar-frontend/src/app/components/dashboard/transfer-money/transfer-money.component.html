<create-form
    [loadingData]="loading() || saving()"
    loadingMessage="Working…"
    icon="swap_horiz"
    [entity]="entity"
    [editMode]="false"
    confirmLabel="Move"
    (close)="close()"
    (create)="save()">

    <!-- Apple grouped form: where from / to, how much, then a note. -->
    <form [formGroup]="formGroup" class="dialog-form ios-form">
        <section>
            <p class="ios-group-label">Move money between your sources</p>
            <div class="ios-group">
                <cb-select-input
                    label="From"
                    emptyText="No sources yet"
                    [control]="$any(formGroup.get('fromWalletId'))"
                    [options]="sources()"
                    [displayWith]="displaySource"
                    [valueWith]="$any(sourceIdValue)">
                </cb-select-input>

                <cb-select-input
                    label="To"
                    emptyText="No sources yet"
                    [control]="$any(formGroup.get('toWalletId'))"
                    [options]="sources()"
                    [displayWith]="displaySource"
                    [valueWith]="$any(sourceIdValue)">
                </cb-select-input>
            </div>
        </section>

        <section>
            <div class="ios-group">
                <cb-labeled-form-input
                    [label]="crossCurrency() ? ('Amount sent' + (fromWallet() ? ' (' + fromWallet()!.currency + ')' : '')) : 'Amount'"
                    type="number"
                    [minErrorKey]="'Enter a positive amount.'"
                    [control]="$any(formGroup.get('amountFrom'))">
                </cb-labeled-form-input>

                <cb-labeled-form-input *ngIf="crossCurrency()"
                    [label]="'Amount received' + (toWallet() ? ' (' + toWallet()!.currency + ')' : '')"
                    type="number"
                    [control]="$any(formGroup.get('amountTo'))">
                </cb-labeled-form-input>
            </div>
            <p *ngIf="crossCurrency()" class="ios-group-footer">
                The two sources use different currencies, so enter how much actually lands in the destination.
            </p>
        </section>

        <div class="ios-group">
            <cb-labeled-textarea
                label="Note"
                placeholder="Optional note about this transfer…"
                [control]="$any(formGroup.get('description'))">
            </cb-labeled-textarea>
        </div>
    </form>
</create-form>
