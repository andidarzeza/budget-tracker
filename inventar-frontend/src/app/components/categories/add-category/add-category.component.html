<!-- Routed-page mode (mobile add / edit): an Apple form page, so swiping
     back returns to the list. -->
<ng-container *ngIf="isPageMode; else dialogShell">
    <section class="form-page form-page--edit">
        <header class="form-page__header">
            <button type="button" cb-icon-button (click)="closeDialog(false)" aria-label="Back">
                <mat-icon>arrow_back_ios_new</mat-icon>
            </button>
            <h1 class="form-page__title">{{ isEditMode ? 'Edit category' : 'New category' }}</h1>
            <button type="button" class="form-page__done" (click)="add()">{{ isEditMode ? 'Done' : 'Add' }}</button>
        </header>

        <div class="form-page__body">
            <form [formGroup]="categoryGroup" class="dialog-form">
                <ng-container *ngTemplateOutlet="categoryFields"></ng-container>
            </form>
        </div>
    </section>
</ng-container>

<ng-template #dialogShell>
<create-form [loadingData]="loadingData" [loadingMessage]="loadingMessage" icon="list_alt" [entity]="entity" [editMode]="isEditMode" (close)="closeDialog($event)" (create)="add()">
    <form [formGroup]="categoryGroup" class="dialog-form">
        <ng-container *ngTemplateOutlet="categoryFields"></ng-container>
    </form>
</create-form>
</ng-template>

<!-- Grouped Apple form shared by the dialog (desktop) and the page (mobile). -->
<ng-template #categoryFields>
    <div class="ios-form">
        <div class="ios-group">
            <cb-labeled-form-input
                label="Category"
                type="text"
                [control]="$any(categoryGroup.get('category'))">
            </cb-labeled-form-input>

            <cb-select-input
                label="Category Type"
                [control]="$any(categoryGroup.get('categoryType'))"
                [options]="categoryTypes">
            </cb-select-input>

            <select-icon [formControl]="$any(categoryGroup.get('icon'))"></select-icon>
        </div>

        <div class="ios-group">
            <cb-labeled-form-input
                label="Default amount"
                type="number"
                placeholder="None"
                [control]="$any(categoryGroup.get('defaultAmount'))">
            </cb-labeled-form-input>
        </div>
        <p class="ios-group-footer">Filled in for you when you pick this category, for things that cost the same every time (salary, rent, a daily coffee). You can still change it.</p>

        <div class="ios-group">
            <cb-labeled-textarea
                label="Description"
                placeholder="Write a note…"
                [control]="$any(categoryGroup.get('description'))">
            </cb-labeled-textarea>
        </div>
    </div>
</ng-template>
