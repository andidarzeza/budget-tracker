<div class="lock-screen">
    <div class="lock-glow" aria-hidden="true"></div>
    <theme-switch class="lock-theme"></theme-switch>

    <form class="lock-card" [formGroup]="loginGroup" autocomplete="off" (ngSubmit)="login()">
        <div class="app-loading-overlay" [@inOutAnimation] *ngIf="showSpinner()" role="status" aria-live="polite">
            <span class="app-spinner" aria-hidden="true">
                <span class="app-spinner__track"></span>
                <span class="app-spinner__arc"></span>
            </span>
            <p class="app-loading-label">Signing you in…</p>
        </div>

        <div class="lock-badge" aria-hidden="true">
            <mat-icon>account_balance_wallet</mat-icon>
        </div>
        <div>
            <h1>Welcome back</h1>
            <p class="lock-sub">Sign in to continue to Financa.</p>
        </div>

        <div class="lock-fields">
            <input id="login-username" class="lock-input" type="text" placeholder="Username"
                formControlName="username" autocomplete="username" autofocus
                [class.lock-input--invalid]="loginGroup.get('username')?.touched && loginGroup.get('username')?.invalid" />
            <input id="login-password" class="lock-input" type="password" placeholder="Password"
                formControlName="password" autocomplete="current-password"
                [class.lock-input--invalid]="loginGroup.get('password')?.touched && loginGroup.get('password')?.invalid" />
        </div>

        <button type="submit" class="lock-btn-primary" [disabled]="showSpinner()">
            Sign in <mat-icon aria-hidden="true">arrow_forward</mat-icon>
        </button>

        <p class="lock-switch">
            New to Financa?
            <button type="button" class="lock-link" [disabled]="showSpinner()" (click)="navigate('/register')">Create an account</button>
        </p>

        <p class="lock-foot">
            <mat-icon aria-hidden="true">verified_user</mat-icon> Your books stay private to your account
        </p>
    </form>
</div>
