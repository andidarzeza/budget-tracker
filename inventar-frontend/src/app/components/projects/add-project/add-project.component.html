<create-form [loadingData]="loadingData()" [loadingMessage]="loadingMessage()" icon="flag" [entity]="entity"
    [editMode]="isEditMode" (close)="closeDialog($event)" (create)="add()">

    <form [formGroup]="formGroup" class="dialog-form">
        <!-- Apple grouped form: label-left rows, notes in their own group. -->
        <div class="ios-form">
            <div class="ios-group">
                <cb-labeled-form-input
                    label="Project name"
                    type="text"
                    placeholder="e.g. Trip to Paris"
                    [control]="$any(formGroup.get('name'))">
                </cb-labeled-form-input>

                <cb-labeled-form-input
                    label="Target amount"
                    type="number"
                    [minErrorKey]="'Enter a positive amount.'"
                    [control]="$any(formGroup.get('targetAmount'))">
                </cb-labeled-form-input>

                <cb-select-input
                    label="Currency"
                    [control]="$any(formGroup.get('targetCurrency'))"
                    [options]="currencies"
                    [displayWith]="displayCurrency">
                </cb-select-input>

                <select-icon formControlName="icon"></select-icon>
            </div>

            <div class="ios-group">
                <cb-labeled-textarea
                    label="Description"
                    placeholder="What is this goal about?"
                    [control]="$any(formGroup.get('description'))">
                </cb-labeled-textarea>
            </div>
        </div>
    </form>
</create-form>
