<create-form [loadingData]="loadingData()" [loadingMessage]="loadingMessage()" icon="savings" [entity]="entity"
    [editMode]="isEditMode" (close)="closeDialog($event)" (create)="add()">

    <!-- Apple grouped form: amount and source, then a note. -->
    <form [formGroup]="formGroup" class="dialog-form ios-form">
        <section>
            <div class="ios-group">
                <cb-labeled-form-input
                    label="Amount"
                    type="number"
                    [minErrorKey]="'Enter a positive amount.'"
                    [control]="$any(formGroup.get('amount'))">
                </cb-labeled-form-input>

                <cb-select-input
                    label="Funded from"
                    emptyText="No sources yet"
                    [control]="$any(formGroup.get('walletId'))"
                    [options]="sources()"
                    [displayWith]="displaySource"
                    [valueWith]="$any(sourceIdValue)">
                </cb-select-input>
            </div>
            <p class="ios-group-footer">
                This contribution is also recorded as an expense under <strong>Savings</strong>, reducing the selected source's balance.
            </p>
        </section>

        <div class="ios-group">
            <cb-labeled-textarea
                label="Note"
                placeholder="Optional note about this deposit…"
                [control]="$any(formGroup.get('description'))">
            </cb-labeled-textarea>
        </div>
    </form>
</create-form>
