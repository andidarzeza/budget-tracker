<div class="lock-screen">
    <div class="lock-glow" aria-hidden="true"></div>
    <theme-switch class="lock-theme"></theme-switch>

    <form class="lock-card" [formGroup]="registerGroup" autocomplete="off" (ngSubmit)="login()">
        <div class="app-loading-overlay" [@inOutAnimation] *ngIf="showSpinner()" role="status" aria-live="polite">
            <span class="app-spinner" aria-hidden="true">
                <span class="app-spinner__track"></span>
                <span class="app-spinner__arc"></span>
            </span>
            <p class="app-loading-label">Creating your account…</p>
        </div>

        <div class="lock-badge" aria-hidden="true">
            <mat-icon>account_balance_wallet</mat-icon>
        </div>
        <div>
            <h1>Create your account</h1>
            <p class="lock-sub">Set up your profile to start tracking expenses and income.</p>
        </div>

        <div class="lock-fields">
            <div class="lock-row">
                <input id="register-first-name" class="lock-input" type="text" placeholder="First name"
                    formControlName="firstName" autocomplete="given-name" autofocus
                    [class.lock-input--invalid]="registerGroup.get('firstName')?.touched && registerGroup.get('firstName')?.invalid" />
                <input id="register-last-name" class="lock-input" type="text" placeholder="Last name"
                    formControlName="lastName" autocomplete="family-name"
                    [class.lock-input--invalid]="registerGroup.get('lastName')?.touched && registerGroup.get('lastName')?.invalid" />
            </div>
            <input id="register-username" class="lock-input" type="text" placeholder="Username"
                formControlName="username" autocomplete="username"
                [class.lock-input--invalid]="registerGroup.get('username')?.touched && registerGroup.get('username')?.invalid" />
            <input id="register-password" class="lock-input" type="password" placeholder="Password"
                formControlName="password" autocomplete="new-password"
                [class.lock-input--invalid]="registerGroup.get('password')?.touched && registerGroup.get('password')?.invalid" />
        </div>

        <button type="submit" class="lock-btn-primary" [disabled]="showSpinner()">
            Create account <mat-icon aria-hidden="true">arrow_forward</mat-icon>
        </button>

        <p class="lock-switch">
            Already have an account?
            <button type="button" class="lock-link" [disabled]="showSpinner()" (click)="navigate('/login')">Sign in</button>
        </p>

        <p class="lock-foot">
            <mat-icon aria-hidden="true">verified_user</mat-icon> Your books stay private to your account
        </p>
    </form>
</div>
