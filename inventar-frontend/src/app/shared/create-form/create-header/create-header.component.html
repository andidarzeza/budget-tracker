<!-- Apple form-sheet bar: Cancel · title · Add / Done -->
<header class="dialog-header">
    <button type="button" class="sheet-btn" (click)="closeDialog(false)">Cancel</button>
    <h2 class="dialog-header-title">{{ editMode ? 'Edit' : 'New' }} {{ entity | titlecase }}</h2>
    @if (showConfirm) {
        <button type="button" class="sheet-btn sheet-btn--confirm" (click)="create.emit()">
            {{ confirmLabel || (editMode ? 'Done' : 'Add') }}
        </button>
    } @else {
        <span aria-hidden="true"></span>
    }
</header>
