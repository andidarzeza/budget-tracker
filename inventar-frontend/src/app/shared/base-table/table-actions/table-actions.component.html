<div
    class="ta"
    [class.ta--toolbar-only]="hideEmbeddedTitle"
    [class.ta--mobile]="mobileToolbar"
>
    <div class="ta__toolbar">
        @if (!hideEmbeddedTitle) {
            <div class="ta__title">
                <mat-icon class="primary-icon">{{ tableActionInput?.icon }}</mat-icon>
                <span class="ta__title-text">{{ tableActionInput?.pageName }}</span>
            </div>
        }

        <!-- iOS 26 toolbar: secondary actions share one glass capsule, the
             primary "+" is its own round tinted button. -->
        <div class="ta__actions">
            <div class="ta__group">
                <button type="button" class="ta__btn"
                    [class.ta__btn--active]="filterOpen() || appliedFilterCount() > 0"
                    matTooltip="Filters" matTooltipClass="sidebar-tooltip" matTooltipPosition="below"
                    (click)="toggleFilter()" [attr.aria-expanded]="filterOpen()" aria-label="Filters">
                    <mat-icon fontSet="material-symbols-rounded">filter_list</mat-icon>
                    @if (appliedFilterCount() > 0) {
                        <span class="ta__icon-badge" aria-hidden="true">{{ appliedFilterCount() }}</span>
                    }
                </button>
                <button type="button" class="ta__btn"
                    matTooltip="Refresh" matTooltipClass="sidebar-tooltip" matTooltipPosition="below"
                    (click)="refresh()" aria-label="Refresh">
                    <mat-icon fontSet="material-symbols-rounded">refresh</mat-icon>
                </button>
            </div>
            @if (!tableActionInput?.extra?.hideInsertButton) {
                <button type="button" class="ta__add"
                    matTooltip="New" matTooltipClass="sidebar-tooltip" matTooltipPosition="below"
                    (click)="openDialog()" aria-label="New">
                    <mat-icon fontSet="material-symbols-rounded">add</mat-icon>
                </button>
            }
        </div>
    </div>

    @if (filterOpen()) {
        <filter
            [filterOptions]="filterOptions"
            [initialValues]="lastFilterValues()"
            (applied)="onFilterApplied($event)"
            (reset)="onFilterReset()"
            (closed)="closeFilter()"
        ></filter>
    }
</div>
