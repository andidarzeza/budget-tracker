server.port = 9000

# Local `java -jar` / IDE: MongoDB on localhost (Docker sets SPRING_MONGODB_URI instead).

# Listen on all interfaces so phones on Wi-Fi can reach :9000
server.address = 0.0.0.0

# CORS: only the Angular dev server's origins by default (SpringConfiguration, CORS_ALLOWED_ORIGINS).

# Behind nginx / Caddy: take the client's address from X-Forwarded-For (only trusted from
# private-network proxies), so the login rate limit counts per visitor, not per proxy.
server.forward-headers-strategy=native

# Login tokens are signed with JWT_SECRET (env, 32+ characters). Unset locally: a random key per start.
