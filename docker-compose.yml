# Budget tracker: MongoDB + Spring Boot API + Angular (nginx) on one host.
#
# Copy .env.example → .env and set JWT_SECRET (required). HTTPS is done by the server's own
# nginx + certbot, which proxies to the app on 127.0.0.1:WEB_PORT (see DOCKER.md). The app and
# the API are published on 127.0.0.1 only, so they are not reachable from outside directly.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: inventar
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  backend:
    build:
      context: ./inventar-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/inventar
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ random characters, e.g. openssl rand -base64 48)}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-9000}:9000"

  web:
    build:
      context: ./inventar-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${WEB_PORT:-4001}:80"

volumes:
  mongo_data:
